<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge</title>
<meta name="theme-color" content="#f2f3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Potta+One&text=%E9%8D%9B%E5%8A%9B&display=swap" rel="stylesheet">
<style>
:root{--acc:#e11d2e;--acc2:color-mix(in srgb,var(--acc) 38%,transparent);--accs:color-mix(in srgb,var(--acc) 11%,var(--card));
  --bg:#f2f3f5;--bg2:#f2f3f5;--card:#ffffff;--ink:#121317;--mute:#6b6f7a;--line:#e6e7eb;--soft:#f4f5f7;--track:#eceef1;--bar:#d6d9df;
  --body:#e9eaee;--mus:#d3d6dc;--fig:#8e95a2;--fig2:#c9cdd5;--eq:#2a2d34;--prop:#d6d9df;--prop2:#a3a8b2;--acc2h:color-mix(in srgb,var(--acc) 45%,#ffffff);--ok:#16a34a;--warn:#f59e0b;--P:#e11d48;--C:#f59e0b;--L:#3b82f6;--r:18px;
  --sh:0 1px 2px rgba(16,18,24,.05),0 4px 14px rgba(16,18,24,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--bg2:#17181c;--card:#17181c;--ink:#f3f4f6;--mute:#9a9ea8;--line:#262830;--soft:#1f2026;--track:#2a2c33;--bar:#3a3d46;--body:#26282f;--mus:#3a3d46;--fig:#a7adb8;--fig2:#5a5f69;--eq:#e7e9ee;--prop:#3a3e47;--prop2:#5d636e;--acc2h:color-mix(in srgb,var(--acc) 55%,#17181c);--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f12;--bg2:#17181c;--card:#17181c;--ink:#f3f4f6;--mute:#9a9ea8;--line:#262830;--soft:#1f2026;--track:#2a2c33;--bar:#3a3d46;--body:#26282f;--mus:#3a3d46;--fig:#a7adb8;--fig2:#5a5f69;--eq:#e7e9ee;--prop:#3a3e47;--prop2:#5d636e;--acc2h:color-mix(in srgb,var(--acc) 55%,#17181c);--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;overscroll-behavior-y:contain}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}
/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;flex:none}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh);flex:none}
main{padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
/* navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--mute);border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--acc)}
/* blocs */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.tight{padding:6px 0}
.h2{font-size:18px;font-weight:800;margin:0}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec h2{font-size:19px;font-weight:800;margin:0}
.sec .lnk{font-size:14px;font-weight:700;color:var(--acc)}
.mute{color:var(--mute)}.small{font-size:13px}.b{font-weight:800}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.mid{font-size:22px;font-weight:800;line-height:1.1}
.unit{font-size:14px;font-weight:700;color:var(--mute);margin-left:2px}
.up{color:var(--ok)}.dn{color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;text-align:center;user-select:none}
.btn.sec2{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--acc);min-height:40px;padding:0 8px}
.btn.full{width:100%}.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--acc);border:1.5px solid var(--line)}
.btn:active,.tile:active,.item:active{transform:scale(.98)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:700;box-shadow:var(--sh);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--card)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;font-size:15.5px}.item .s{font-size:13px;color:var(--mute);margin-top:1px}
.item .chev{color:var(--mute)}
.thumb{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb.fg{width:62px;height:50px;background:var(--soft)}.fthumb{width:62px;height:48px;display:block}
.figbox{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px 10px 12px;margin-bottom:12px;position:relative}
.fig{width:100%;display:block;max-height:250px}
.figbox .pp{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.frames div{background:var(--soft);border-radius:12px;padding:4px 4px 6px;text-align:center;font-size:12px;font-weight:800;color:var(--mute)}.frames svg{width:100%;display:block}
.rchip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--accs);color:var(--acc);font-size:13px;font-weight:800}
.bmini{width:30px;height:88px;margin-top:-1px}
.thumb .thumb.fg{width:62px;height:50px;background:var(--soft)}.fthumb{width:62px;height:48px;display:block}
.figbox{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px 10px 12px;margin-bottom:12px;position:relative}
.fig{width:100%;display:block;max-height:250px}
.figbox .pp{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.frames div{background:var(--soft);border-radius:12px;padding:4px 4px 6px;text-align:center;font-size:12px;font-weight:800;color:var(--mute)}.frames svg{width:100%;display:block}
.rchip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--accs);color:var(--acc);font-size:13px;font-weight:800}
.bmini{height:44px;width:24px}
.bmap{width:100%;max-width:300px;display:block;margin:0 auto}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700;color:var(--mute)}
.pill.acc{background:var(--accs);color:var(--acc)}
.empty{padding:22px 10px;text-align:center;color:var(--mute);font-size:14px}
.empty.small{padding:14px 6px}
.tile{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile .lb{font-size:13px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px}
.hero{background:var(--ink);color:var(--card);border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero .k{font-size:13px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.6px}
.hero .t{font-size:24px;font-weight:800;margin:4px 0 2px}
.hero .s{font-size:14px;opacity:.75}
.hero .btn{margin-top:14px}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:14px}
.week div{flex:1;text-align:center;font-size:12px;font-weight:700;opacity:.65}
.week i{display:block;width:30px;height:30px;margin:4px auto 0;border-radius:50%;border:2px solid currentColor;opacity:.5;display:grid;place-items:center}
.week .on i{background:var(--acc);border-color:var(--acc);opacity:1;color:#fff}
.week .today{opacity:1}
.ring{position:relative;flex:none}.ring svg{display:block}.ring .ri{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.bar{height:8px;background:var(--track);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.macro{flex:1}.macro .n{font-size:12.5px;white-space:nowrap;gap:4px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:5px}.macro .n b{color:var(--ink)}
.chart{width:100%;display:block;touch-action:pan-y;user-select:none}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .ax{font-size:9.5px;fill:var(--mute)}
.chartw{position:relative}
.kpis{display:flex;gap:6px;margin-bottom:10px}.kpis>div{flex:1;background:var(--soft);border-radius:12px;padding:9px 10px}.kpis b{display:block;font-size:17px}.kpis small{font-size:11.5px;color:var(--mute);font-weight:700}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}.hbar span{width:112px;flex:none;font-weight:700}.hbar .bar{flex:1;height:10px}.hbar em{font-style:normal;width:26px;text-align:right;font-weight:800}
/* formulaires */
label.f{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 6px}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=password],select,textarea{width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.search{position:relative}.search .ic{position:absolute;left:13px;top:13px;color:var(--mute)}.search input{padding-left:42px;background:var(--card);border-color:transparent;box-shadow:var(--sh)}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}.stepper input{text-align:center;font-weight:800;font-size:22px}
/* feuilles (pop-up plein écran) */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,11,14,.45);display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:su .22s cubic-bezier(.2,.8,.2,1)}
.sheet.auto{height:auto}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px 12px 8px 18px}
.sh-h h3{flex:1;margin:0;font-size:20px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-b{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));flex:1;-webkit-overflow-scrolling:touch}
.sh-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card);display:flex;gap:10px}
@keyframes su{from{transform:translateY(40px);opacity:0}}@keyframes fi{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.ov,.sheet{animation:none}}
/* séance en cours */
.exc{background:var(--card);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.exc .hd{display:flex;align-items:center;gap:10px;padding:12px 12px 6px 14px}
.exc .hd .t{font-weight:800;font-size:16.5px}
.exc .hd .s{font-size:12.5px;color:var(--mute);font-weight:700}
.sets{padding:2px 10px 8px}
.srow{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;padding:4px 0}
.srow.h{font-size:11.5px;font-weight:800;color:var(--mute);text-transform:uppercase;text-align:center;padding:2px 0}
.srow .n{font-weight:800;text-align:center;color:var(--mute)}
.srow input{min-height:44px;text-align:center;font-weight:800;font-size:17px;padding:0 4px;background:var(--soft);border-color:transparent}
.srow input::placeholder{color:color-mix(in srgb,var(--mute) 65%,transparent);font-weight:700}
.ok{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--mute)}
.srow.done input{background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.srow.done .ok{background:var(--ok);color:#fff}
.addset{width:100%;padding:10px;font-size:14px;font-weight:800;color:var(--acc)}

.restbar{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--card);border-radius:16px;padding:6px 8px 6px 6px;z-index:60}
.restbar.in{margin:0 12px 8px;flex:none}
.restbar.out{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);max-width:620px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.restbar .rr{width:44px;height:44px;flex:none}.restbar .rr svg{display:block}
.restbar .lb{flex:1;min-width:0;line-height:1.2}.restbar .lb b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.restbar .lb span.nx{font-size:12px;opacity:.7;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar button{background:rgba(127,127,127,.28);color:inherit;border-radius:10px;min-height:36px;min-width:40px;padding:0 8px;font-weight:800;font-size:13.5px;display:grid;place-items:center}
.restbar button.sk{background:var(--acc);color:#fff}
.en{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0}.en i{width:10px;height:10px;border-radius:3px;flex:none}.en span{flex:1;color:var(--mute);font-weight:700}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:10px 0 6px;background:var(--track)}.stack i{display:block;height:100%}
.spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.spgrid button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.spgrid button span{font-size:22px}.spgrid button.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
.cp{border-radius:22px;padding:18px 14px;text-align:center;background:var(--ink);color:var(--card)}.cp.work{background:var(--acc);color:#fff}.cp.rest{background:var(--ok);color:#fff}
.cp .cl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.85}.cp .ct{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:4px 0}.cp .cn{font-size:22px;font-weight:800}.cp .cs{font-size:14px;opacity:.85;margin-top:2px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pgrid button{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.pgrid .fg2{background:var(--soft);border-radius:12px;margin-bottom:6px}.pgrid .fg2 svg{width:100%;height:72px;display:block}.pgrid .t{font-weight:800;font-size:14px;line-height:1.2}.pgrid .s{font-size:12.5px;color:var(--mute);font-weight:700}
.wiz .big{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.wiz .big button{aspect-ratio:1;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:26px;font-weight:800}.wiz .big button.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc);width:22px;border-radius:5px}
.livebar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;max-width:616px;margin:0 auto}
.livebar button{width:100%;display:flex;align-items:center;gap:10px;background:var(--acc);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* nutrition */
.meal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.meal .mh .t{font-weight:800;font-size:16.5px;flex:1}
.meal .fi{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.meal .fi .t{font-weight:700;font-size:15px}.meal .fi .s{font-size:12.5px;color:var(--mute)}
.plus{width:34px;height:34px;border-radius:50%;background:var(--accs);color:var(--acc);display:grid;place-items:center;flex:none}
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glasses button{width:34px;height:40px;border-radius:8px 8px 12px 12px;border:2px solid var(--L);opacity:.35;display:grid;place-items:center;color:var(--L)}
.glasses button.on{opacity:1;background:color-mix(in srgb,var(--L) 18%,transparent)}
.port{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* photos */
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phgrid button{aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;background:var(--soft)}
.phgrid img{width:100%;height:100%;object-fit:cover;display:block}
.phgrid span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;border-radius:12px;aspect-ratio:3/4;object-fit:cover;display:block}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:12px;margin:0 0 12px;font-size:15.5px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accs);color:var(--acc);font-weight:800;display:grid;place-items:center;font-size:14px}
.tipbox{display:flex;gap:10px;background:var(--accs);border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:700}
.tipbox .ic{color:var(--acc)}
.prg{display:block;width:100%;text-align:left}
.gi{width:44px;height:44px;border-radius:14px;background:var(--accs);color:var(--acc);display:grid;place-items:center;flex:none}
.goals{display:flex;flex-direction:column;gap:8px}
.gopt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px;text-align:left;box-shadow:var(--sh)}
.gopt b{display:block;font-size:16px}.gopt span{font-size:13px;color:var(--mute)}
.gopt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.gopt.on{border-color:var(--acc)}.gopt.on .rd{border:7px solid var(--acc)}
.ropt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.ropt b{display:block;font-size:15px}.ropt span{font-size:11.5px;color:var(--mute);font-weight:700}
.ropt.on{border-color:var(--acc);background:var(--accs)}.ropt.on b{color:var(--acc)}
.grid1{display:grid;grid-template-columns:1fr}
.pl{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}.pl:last-child{border:0}.pl span{color:var(--mute);font-weight:700}
.dayrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.num{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.num.on{background:var(--acc);color:#fff}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14.5px;z-index:99;transition:transform .25s;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.banner{display:flex;align-items:center;gap:10px;background:var(--accs);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:700}
.spin{width:34px;height:34px;border:4px solid var(--track);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pr{color:var(--warn)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
.tog input{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--track);border-radius:20px;position:relative;cursor:pointer;flex:none}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog input:checked{background:var(--acc)}.tog input:checked::after{left:21px}
</style>

  const done=(src,w,h,cleanup)=>{const r=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);
    c.getContext("2d").drawImage(src,0,0,c.width,c.height);cleanup&&cleanup();const url=c.toDataURL("image/jpeg",.84);c.toBlob(b=>res({url,blob:b}),"image/jpeg",.84)};
  const viaImg=()=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>done(im,im.naturalWidth,im.naturalHeight);im.onerror=()=>rej(new Error("img"));im.src=fr.result};fr.onerror=()=>rej(new Error("read"));fr.readAsDataURL(file)};
  if(window.createImageBitmap){createImageBitmap(file,{imageOrientation:"from-image"}).then(b=>done(b,b.width,b.height,()=>b.close&&b.close())).catch(viaImg)}else viaImg()})}

function lineChart(data,opt){opt=opt||{};

  const W=340,H=opt.h||170,pl=36,pr=12,pt=14,pb=24;

  let y0=Math.min(...ys),y1=Math.max(...ys);if(opt.goal!=null){y0=Math.min(y0,opt.goal);y1=Math.max(y1,opt.goal)}

  let g="";for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,y=Y(v);g+=`<line x1="${pl}" y1="${f1(y)}" x2="${W-pr}" y2="${f1(y)}" class="gl"/><text x="${pl-6}" y="${f1(y+3.5)}" text-anchor="end" class="ax">${nf(v,opt.dec==null?1:opt.dec)}</text>`}

  const area=line+`L${f1(pts[pts.length-1][0])} ${H-pb}L${f1(pts[0][0])} ${H-pb}Z`;
  let avg="";if(opt.avg&&data.length>4){const a=data.map(d=>{const t=parse(d.d).getTime();const w=data.filter(e=>{const u=parse(e.d).getTime();return u<=t&&u>t-7*864e5});return [X(t),Y(sum(w,e=>e.v)/w.length)]});
    avg=`<path d="${a.map((p,i)=>(i?"L":"M")+f1(p[0])+" "+f1(p[1])).join("")}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 4" opacity=".45"/>`}
  const gl=opt.goal!=null?`<line x1="${pl}" y1="${f1(Y(opt.goal))}" x2="${W-pr}" y2="${f1(Y(opt.goal))}" stroke="var(--ok)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${W-pr}" y="${f1(Y(opt.goal)-5)}" text-anchor="end" class="ax" fill="var(--ok)" style="fill:var(--ok)">objectif ${nf(opt.goal)}</text>`:"";
  const gid="g"+uid();const enc=data.map((d,i)=>`${f1(pts[i][0])},${f1(pts[i][1])},${fmtD(d.d)} · ${nf(d.v,opt.dec==null?1:opt.dec)} ${opt.unit||""}`).join("|");
  return `<div class="chartw"><svg viewBox="0 0 ${W} ${H}" class="chart" data-pts="${esc(enc)}" role="img" aria-label="${esc(opt.label||"Graphique")}">

    ${g}${gl}<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>${avg}
    ${pts.length<=31?pts.map(p=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="2.4" fill="var(--card)" stroke="var(--acc)" stroke-width="1.6"/>`).join(""):""}
    <circle cx="${f1(pts[pts.length-1][0])}" cy="${f1(pts[pts.length-1][1])}" r="4.5" fill="var(--acc)"/>

function barChart(items,opt){opt=opt||{};if(!items.length)return `<div class="empty small">Pas encore de données.</div>`;

function doneEx(){const c={};S.sessions.forEach(s=>s.ex.forEach(x=>{if(x.sets.length)c[x.e]=(c[x.e]||0)+1}));return Object.keys(c).filter(id=>exById(id).t!=="m").sort((a,b)=>c[b]-c[a])}
function forceStat(id){const e=exById(id),H=exHistory(id);const isW=e.t==="w"||(e.t==="b"&&H.some(h=>h.maxW>0));const val=h=>e.t==="s"?h.maxR:isW?f1(h.best.v):h.maxR;
  const D=H.map(h=>({d:h.d,v:val(h)}));const unit=e.t==="s"?"s":isW?"kg":"reps";const bh=H.reduce((m,y)=>y.best.v>m.best.v?y:m,H[0]);
  const rec=isW?`${nf(bh.best.w)} kg × ${bh.best.r}`:`${Math.max(...H.map(h=>h.maxR))} ${unit}`;return {e,H,D,isW,unit,rec,diff:D.length>1?D[D.length-1].v-D[0].v:0}}
function tForce(){const L=doneEx();if(!L.length)return `<div class="card empty">Termine une séance pour suivre ta force sur chaque exercice.</div>`;
  const G=UI.forceG||"";const gs=[...new Set(L.map(id=>exById(id).g))];const LL=L.filter(id=>!G||exById(id).g===G);
  return `<div class="chips" style="margin-bottom:8px"><button class="chip ${!G?"on":""}" data-fg="">Tous</button>${GROUPS.filter(g=>gs.includes(g[0])).map(([k,l])=>`<button class="chip ${G===k?"on":""}" data-fg="${k}">${l}</button>`).join("")}</div>

  <div class="pgrid">${LL.map(id=>{const f=forceStat(id);return `<button data-fx="${id}"><div class="fg2">${figSVG(f.e,1)}</div><div class="t">${esc(f.e.n)}</div><div class="s">Record : ${esc(f.rec)}</div>

function tStats(){const n=+UI.statR;const mon=monday(NOW);const weeks=Array.from({length:n},(_,i)=>key(addDays(mon,-(n-1-i)*7)));

  const lbl=w=>{const d=parse(w);return `${d.getDate()}/${d.getMonth()+1}`};

  <div class="card"><div class="b">Tonnage par semaine</div><div class="small mute" style="margin-bottom:6px">Total des kilos soulevés (charge × répétitions)</div>${barChart(per.map((p,i)=>({l:lbl(p.w),v:p.v/1000,hl:i===n-1})),{fmt:v=>nf(v,1),label:"Tonnage par semaine",h:130})}</div>

    ${GROUPS.filter(g=>g[0]!=="cardio").map(([k,l])=>{const c=g7[k]||0;return `<div class="hbar"><span>${l}</span><div class="bar"><i style="width:${c/gm*100}%;background:${c>=10?"var(--ok)":c?"var(--acc)":"transparent"}"></i></div><em>${c}</em></div>`}).join("")}</div>

  <div class="card"><div class="b">Protéines · 14 jours</div><div class="small mute" style="margin-bottom:6px">Objectif : ${t.prot} g par jour</div>${barChart(pr,{goal:t.prot,label:"Protéines sur 14 jours",h:130,fmt:v=>""})}</div>`}

function scheme(goal,first,e){if(e.t==="s")return {s:3,r:"30s",rest:45};if(e.t==="m")return {s:1,r:"20min",rest:0};
  const c={seche:{s:3,r:"12-15",rest:60},perte:{s:3,r:"12-15",rest:60},force:first?{s:5,r:"5",rest:180}:{s:3,r:"6-8",rest:120},masse:first?{s:4,r:"6-8",rest:120}:{s:3,r:"8-12",rest:90},recompo:{s:3,r:"8-12",rest:90},maintien:{s:3,r:"10-12",rest:75}}[goal]||{s:3,r:"10",rest:90};

function tick(f){if(!S.set.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||660;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.12);o.start();o.stop(AC.currentTime+.13)}catch(e){}}
function circPlay(c){let segs=[{k:"prep",sec:10,lb:"Prépare-toi"}];
  if(c.type==="interval")for(let r=0;r<c.rounds;r++)c.items.forEach(([e],i)=>{segs.push({k:"work",sec:c.work,e,r,i});if(!(r===c.rounds-1&&i===c.items.length-1))segs.push({k:"rest",sec:c.rest,r,i,next:c.items[(i+1)%c.items.length][0]})});
  if(c.type==="emom")for(let m=0;m<c.min;m++){const it=c.items[m%c.items.length];segs.push({k:"work",sec:60,e:it[0],a:it[1],r:m})}
  if(c.type==="amrap")segs.push({k:"amrap",sec:c.min*60});
  if(c.type==="fortime")segs.push({k:"fortime",sec:0});
  let si=0,segStart=Date.now(),paused=false,pauseAt=0,startAll=Date.now(),rounds=0,step=0,timer=null,done=false,lastSec=-1;WAKE.on();
  sheet(c.n,(b,close,f)=>{
    const elapsedSeg=()=>((paused?pauseAt:Date.now())-segStart)/1000;
    const finish=(early)=>{if(done)return;done=true;clearInterval(timer);WAKE.off();beep();buzz([300,120,300]);
      const tot=Math.max(1,Math.round(((paused?pauseAt:Date.now())-startAll)/60000));const secs=Math.round(((paused?pauseAt:Date.now())-startAll)/1000);
      const score=c.type==="amrap"?`${rounds} tour${rounds>1?"s":""}${step?` + ${step} exo${step>1?"s":""}`:""}`:c.type==="fortime"?`${Math.floor(secs/60)} min ${String(secs%60).padStart(2,"0")} s`:early?"arrêté avant la fin":"terminé";
      sheet("Circuit terminé",(b2,c2,f2)=>{b2.innerHTML=`<div style="text-align:center;padding:10px 0"><div style="width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 10px">${icon("check",40)}</div><div class="mid">${esc(c.n)}</div><div class="b" style="color:var(--acc);font-size:20px;margin-top:6px">${esc(score)}</div></div>
        <div class="kpis"><div><small>Durée</small><b>${tot} min</b></div><div><small>Calories env.</small><b>${Math.round(7*kgNow()*tot/60)} kcal</b></div></div>`;
        f2.innerHTML=`<button class="btn sec2" id="nS">Ne pas enregistrer</button><button class="btn" style="flex:1" id="yS">Enregistrer</button>`;
        f2.querySelector("#nS").onclick=c2;f2.querySelector("#yS").onclick=()=>{S.sessions.push({id:uid(),d:TODAY,dur:tot,n:c.n,circuit:true,score,ex:c.items.map(([e])=>({e,sets:[]})).filter(()=>false),vol:0});save();c2();render();toast("Circuit enregistré")}},{auto:true,foot:true});close()};
    const draw=()=>{if(done)return;const s=segs[si];let left,big,lbl,fig=null,nextE=null,sub="";
      if(s.k==="fortime"){const t=Math.floor(elapsedSeg());big=`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;lbl="Chrono";}
      else{left=Math.max(0,Math.ceil(s.sec-elapsedSeg()));big=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`}
      if(s.k==="prep"){lbl="Prépare-toi";fig=c.items[0][0];sub="Premier exercice : "+exById(c.items[0][0]).n}
      if(s.k==="work"){lbl=c.type==="emom"?`Minute ${s.r+1} / ${c.min}`:`Tour ${s.r+1} / ${c.rounds} · exercice ${s.i+1} / ${c.items.length}`;fig=s.e;sub=c.type==="emom"?amt(s.a)+" puis repos":"À fond !";const n=segs.slice(si+1).find(x=>x.k==="work");nextE=n&&n.e}
      if(s.k==="rest"){lbl="Repos";fig=s.next;sub="Ensuite : "+exById(s.next).n}
      const list=(c.type==="amrap"||c.type==="fortime")?`<div class="card tight" style="margin-top:12px">${c.items.map(([e,a],i)=>`<div class="item" style="${i===step?"background:var(--accs)":""}"><span class="num ${i<step?"on":""}">${i<step?icon("check",14):i+1}</span><div class="grow t">${esc(exById(e).n)}</div><b>${esc(amt(a))}</b></div>`).join("")}</div>`:"";
      const tour=(c.type==="amrap"||c.type==="fortime")?`<div class="row" style="justify-content:center;gap:10px;margin-top:10px"><span class="pill acc" style="font-size:15px">Tours : ${rounds}${c.type==="fortime"?" / "+c.rounds:""}</span></div>`:"";
      const showFig=fig||(c.type==="amrap"||c.type==="fortime"?c.items[step][0]:null);
      b.innerHTML=`<div class="cp ${s.k}"><div class="cl">${esc(lbl||CTYPES[c.type][0])}</div><div class="ct">${big}</div>${showFig&&s.k!=="amrap"&&s.k!=="fortime"?`<div class="cn">${esc(exById(showFig).n)}</div>`:""}<div class="cs">${esc(sub)}</div></div>
        ${showFig?`<div class="figbox" style="margin-top:12px"><div id="cpFig"></div></div>`:""}
        ${nextE?`<div class="small mute b" style="text-align:center">Ensuite : ${esc(exById(nextE).n)}</div>`:""}${tour}${list}
        ${c.type==="interval"||c.type==="emom"?`<div class="bar" style="margin-top:14px"><i style="width:${si/(segs.length-1)*100}%"></i></div>`:""}`;
      if(showFig){const el=b.querySelector("#cpFig");if(!ANIM.el||ANIM.el!==el||ANIM.e!==exById(showFig))ANIM.start(el,exById(showFig))}};
    const footer=()=>{const s=segs[si];
      if(c.type==="amrap"||c.type==="fortime")f.innerHTML=`<button class="btn sec2" id="cpP">${icon(paused?"play":"pause",18)}</button><button class="btn" style="flex:1" id="cpN">${icon("check",18)} Exercice fait</button><button class="btn sec2" id="cpE">Fin</button>`;
      else f.innerHTML=`<button class="btn sec2" id="cpP">${icon(paused?"play":"pause",18)} ${paused?"Reprendre":"Pause"}</button><button class="btn sec2" id="cpS">Passer ›</button><button class="btn sec2" id="cpE">Fin</button>`;
      f.querySelector("#cpP").onclick=()=>{if(paused){const d=Date.now()-pauseAt;segStart+=d;startAll+=d;paused=false}else{paused=true;pauseAt=Date.now()}footer();draw()};
      f.querySelector("#cpE").onclick=()=>confirmBox("Terminer le circuit ?","Tu pourras enregistrer ce que tu as fait.","Terminer",()=>finish(true));
      const sk=f.querySelector("#cpS");if(sk)sk.onclick=()=>next();
      const nx=f.querySelector("#cpN");if(nx)nx.onclick=()=>{buzz(20);step++;if(step>=c.items.length){step=0;rounds++;tick(880);if(c.type==="fortime"&&rounds>=c.rounds){finish();return}}draw()}};
    const next=()=>{si++;segStart=Date.now();lastSec=-1;if(si>=segs.length){finish();return}const s=segs[si];beep();buzz(s.k==="work"?[200,80,200]:150);if(s.k==="amrap"||s.k==="fortime")startAll=Date.now();draw()};
    timer=setInterval(()=>{if(paused||done)return;const s=segs[si];if(s.k==="fortime"){draw();return}const left=s.sec-elapsedSeg();const ls=Math.ceil(left);
      if(ls!==lastSec){lastSec=ls;if(ls<=3&&ls>0)tick(660)}if(left<=0)next();else{const el=b.querySelector(".ct");if(el)el.textContent=`${Math.floor(ls/60)}:${String(ls%60).padStart(2,"0")}`}},200);
    draw();footer()},{foot:true,onClose:()=>{clearInterval(timer);WAKE.off();ANIM.stop()}})}

function sheet(title,build,opt){opt=opt||{};const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="sheet ${opt.auto?"auto":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-h"><h3>${esc(title)}</h3>${opt.head||""}<button class="iconbtn" data-close aria-label="${opt.closeLabel||"Fermer"}">${icon(opt.closeIcon||"x")}</button></div><div class="sh-b"></div>${opt.foot?'<div class="sh-f"></div>':""}</div>`;
  document.body.appendChild(ov);document.body.classList.add("noscroll");
  const body=ov.querySelector(".sh-b"),foot=ov.querySelector(".sh-f");let closed=false;
  const close=()=>{if(closed)return;closed=true;ov.remove();if(!document.querySelector(".ov"))document.body.classList.remove("noscroll");opt.onClose&&opt.onClose()};
  ov._close=close;ov.querySelector("[data-close]").onclick=close;ov.addEventListener("click",e=>{if(e.target===ov)close()});
  build(body,close,foot,ov);return {close,body,foot,ov}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const o=[...document.querySelectorAll(".ov")].pop();if(o&&o._close)o._close()}});
function confirmBox(title,text,ok,fn){sheet(title,(b,close,f)=>{b.innerHTML=`<p style="margin:4px 0 0">${esc(text)}</p>`;
  f.innerHTML=`<button class="btn sec2" style="flex:1" id="cN">Annuler</button><button class="btn" style="flex:1" id="cY">${esc(ok)}</button>`;
  f.querySelector("#cN").onclick=close;f.querySelector("#cY").onclick=()=>{close();fn()}},{auto:true,foot:true})}
const repsLbl=x=>{const e=exById(x.e);if(e.t==="m")return x.r||"20min";return `${x.s} × ${x.r}`};
const restLbl=s=>!s?"":s<60?`${s} s`:s%60?`${Math.floor(s/60)} min ${s%60}`:`${s/60} min`;
const itemRow=(x,attr)=>{const e=exById(x.e);return `<button class="item" ${attr||""}><div class="thumb fg">${figSVG(e,1,"fthumb")}</div><div class="grow"><div class="t">${esc(e.n)}</div><div class="s">${repsLbl(x)}${x.rest?" · repos "+restLbl(x.rest):""}</div></div><span class="chev">${icon("right",18)}</span></button>`};

function quiz(){const A={goal:{seche:"seche",perte:"seche",force:"force",maintien:"forme",recompo:"masse"}[S.profile.goal]||"masse",place:"salle",days:3,lvl:1};
  sheet("Trouver mon programme",(b,close)=>{const Q=(k,l,opts)=>`<label class="f">${l}</label><div class="chips" style="margin:0;padding-left:0;padding-right:0;flex-wrap:wrap">${opts.map(([v,t])=>`<button class="chip ${A[k]==v?"on":""}" data-k="${k}" data-v="${v}">${t}</button>`).join("")}</div>`;
    const draw=()=>{const sc=TEMPLATES.map(t=>{let s=0;if(t.place===A.place)s+=4;else if(A.place==="salle")s+=0;else s-=20;if(A.place==="halteres"&&t.place==="maison")s+=2;

      <div class="frames"><div>${figSVG(e,0)}1 · Départ</div><div>${figSVG(e,1)}2 · Arrivée</div></div></div>

/* ---- photo d'un plat (estimation par Claude) ---- */
const KEYK="forge_apikey";
const AI={sample:null,checked:false,
  async init(){try{if(window.claude&&typeof window.claude.use==="function"){const s=await window.claude.use("sample");if(s){const lim=await s.limits().catch(()=>null);if(!lim||lim.images!==false)this.sample=s}}}catch(e){}this.checked=true},
  key(){try{return localStorage.getItem(KEYK)||""}catch(e){return ""}},
  mode(){return this.sample?"claude":(this.key()?"api":null)},
  prompt(note){return `Tu es nutritionniste du sport. Analyse la photo de ce repas.
1. Identifie chaque aliment visible (sauces, huiles et boissons comprises si on les voit).
2. Estime la quantité de chaque aliment en grammes avec les repères visuels (assiette ≈ 26 cm, fourchette ≈ 19 cm). Pour les aliments cuits, estime le poids cuit.
3. Calcule pour chaque aliment les calories et les macronutriments avec des valeurs nutritionnelles moyennes.
${note?`Précisions de l'utilisateur : « ${note.slice(0,300)} ».\n`:""}Si la photo ne montre pas de nourriture, renvoie "items" vide et explique-le dans "remarque".
Réponds uniquement avec un objet JSON en français, de cette forme exacte :
{"plat":"nom court","items":[{"nom":"Riz basmati cuit","grammes":180,"kcal":218,"p":6.3,"g":45,"l":0.7}],"confiance":"faible|moyenne|bonne","remarque":"une phrase utile"}
p = protéines (g), g = glucides (g), l = lipides (g).`},
  async analyze(img,note,signal){const prompt=this.prompt(note);
    if(this.mode()==="claude")return await this.sample.json(prompt,{images:[img.blob],signal,modelTier:"default",cache:false});
    if(this.mode()==="api"){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":this.key(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1500,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:img.url.split(",")[1]}},{type:"text",text:prompt}]}]})});
      if(!r.ok)throw {code:r.status===401?"bad_key":r.status===429?"rate_limited":"upstream_error"};
      const j=await r.json();const t=(j.content||[]).map(c=>c.text||"").join("");const a=t.indexOf("{"),z=t.lastIndexOf("}");if(a<0||z<a)throw {code:"invalid_json"};return JSON.parse(t.slice(a,z+1))}
    throw {code:"no_mode"}}};
const aiErr=c=>({not_granted:"L'appli n'a pas l'autorisation d'utiliser Claude.",rate_limited:"Trop de demandes. Réessaie dans quelques minutes.",image_rejected:"Image illisible. Essaie une autre photo.",invalid_json:"Réponse incomplète. Réessaie.",bad_key:"Clé API refusée. Vérifie-la dans les réglages.",no_mode:"Analyse photo non activée."}[c]||"L'analyse a échoué. Vérifie ta connexion.");
function scanMeal(dk){let meal=dk===TODAY?autoMeal():"dej",img=null,res=null,ctl=null;
  sheet("Photo du plat",(b,close,f)=>{
    const pickHtml=lbl=>filePicker(`${icon("cam",18)} ${lbl}`,"btn full",async file=>{try{img=await readImage(file,1280);res=null;draw()}catch(e){toast("Impossible de lire cette image")}});
    const draw=st=>{f.innerHTML="";
      if(!AI.mode()){b.innerHTML=`<div class="card" style="text-align:center">${icon("cam",40).replace('class="ic"','class="ic" style="margin:0 auto 8px;color:var(--acc)"')}<div class="h2">Estimation par photo</div>
          <p class="mute small" style="margin:8px 0 0">L'analyse automatique utilise l'intelligence artificielle de Claude. Dans l'appli installée sur ton téléphone, il faut une clé d'accès (API) personnelle. Une analyse coûte environ 1 centime.</p></div>
        <ol class="steps"><li>Crée un compte sur console.anthropic.com et ajoute quelques euros de crédit.</li><li>Dans « API Keys », crée une clé et copie-la.</li><li>Colle-la dans Réglages › Analyse photo.</li></ol>
        <div class="grid2"><button class="btn sec2" id="goK">Ajouter ma clé</button><button class="btn" id="goM">Saisir à la main</button></div>`;
        b.querySelector("#goK").onclick=()=>{close();settings("ia")};b.querySelector("#goM").onclick=()=>{close();foodSearch(dk,meal)};return}
      if(!img){b.innerHTML=`<div class="card" style="text-align:center;padding:28px 16px">${icon("cam",44).replace('class="ic"','class="ic" style="margin:0 auto 10px;color:var(--acc)"')}<div class="h2">Prends ton assiette en photo</div><p class="mute small" style="margin:6px 0 0">Vue de dessus, toute l'assiette dans le cadre, bonne lumière.</p></div>${pickHtml("Prendre / choisir une photo")}`;return}
      if(st==="busy"){b.innerHTML=`<img src="${img.url}" alt="Photo du plat" style="width:100%;border-radius:16px;max-height:260px;object-fit:cover"><div style="text-align:center;padding:20px"><div class="spin"></div><p class="b">Analyse en cours…</p><p class="small mute">10 à 40 secondes</p></div>`;

        f.innerHTML=`<button class="btn sec2" id="re">Changer</button><button class="btn" style="flex:1" id="go">Analyser</button>`;
        f.querySelector("#re").onclick=()=>{img=null;draw()};
        f.querySelector("#go").onclick=async()=>{const note=b.querySelector("#note").value.trim();ctl=new AbortController();draw("busy");
          try{const r=await AI.analyze(img,note,ctl.signal);const items=(r&&Array.isArray(r.items)?r.items:[]).map(x=>{const g=Math.max(0,+x.grammes||0);
              return {nom:String(x.nom||"Aliment").slice(0,60),g0:g||100,g:g||100,k:Math.max(0,+x.kcal||0),p:Math.max(0,+x.p||0),c:Math.max(0,+x.g||0),l:Math.max(0,+x.l||0)}}).filter(x=>x.k>0||x.g>0);
            res={plat:String(r&&r.plat||"Mon plat").slice(0,60),items,conf:String(r&&r.confiance||"moyenne"),rem:String(r&&r.remarque||"").slice(0,300)};draw()}
          catch(e){draw();if(!(e&&(e.code==="cancelled"||e.name==="AbortError")))toast(aiErr(e&&e.code))}};return}
      const tot=res.items.reduce((a,x)=>{const q=x.g/x.g0;a.k+=x.k*q;a.p+=x.p*q;a.c+=x.c*q;a.l+=x.l*q;return a},{k:0,p:0,c:0,l:0});
      b.innerHTML=`<div class="row"><img src="${img.url}" alt="" style="width:72px;height:72px;border-radius:12px;object-fit:cover"><div class="grow"><div class="h2">${esc(res.plat)}</div><span class="pill">Confiance ${esc(res.conf)}</span></div></div>
        ${res.rem?`<p class="small mute">${esc(res.rem)}</p>`:""}
        <div class="kpis" style="margin-top:12px"><div><small>kcal</small><b>${Math.round(tot.k)}</b></div><div><small>Prot.</small><b>${nf(tot.p,0)}</b></div><div><small>Gluc.</small><b>${nf(tot.c,0)}</b></div><div><small>Lip.</small><b>${nf(tot.l,0)}</b></div></div>
        <p class="small mute b" style="margin:4px 2px 6px">Ajuste les grammes si besoin :</p>
        <div class="card tight">${res.items.map((x,i)=>`<div class="item"><div class="grow"><div class="t">${esc(x.nom)}</div><div class="s">${Math.round(x.k*x.g/x.g0)} kcal</div></div><input type="number" inputmode="numeric" data-i="${i}" value="${Math.round(x.g)}" style="width:84px;min-height:40px;text-align:center" aria-label="Grammes de ${esc(x.nom)}"><span class="small mute">g</span><button class="iconbtn" style="box-shadow:none;width:34px" data-rm="${i}" aria-label="Retirer">${icon("x",16)}</button></div>`).join("")||`<div class="empty">Aucun aliment reconnu.</div>`}</div>
        <label class="f">Repas</label>${seg("sM",MEALS.map(([k,l])=>[k,l.replace("Petit-déjeuner","Petit-déj")]),meal)}`;
      b.querySelectorAll("[data-i]").forEach(i=>i.onchange=()=>{res.items[+i.dataset.i].g=Math.max(0,num(i.value)||0);draw()});
      b.querySelectorAll("[data-rm]").forEach(i=>i.onclick=()=>{res.items.splice(+i.dataset.rm,1);draw()});
      onSeg(b,"sM",m=>{meal=m;draw()});
      f.innerHTML=`<button class="btn sec2" id="re2">Autre photo</button><button class="btn" style="flex:1" id="add" ${res.items.length?"":"disabled"}>Ajouter au repas</button>`;
      f.querySelector("#re2").onclick=()=>{img=null;res=null;draw()};
      f.querySelector("#add").onclick=()=>{res.items.forEach(x=>{const q=x.g/x.g0;addFood(dk,meal,{id:uid(),f:null,n:x.nom,g:Math.round(x.g),k:Math.round(x.k*q),p:f1(x.p*q),c:f1(x.c*q),l:f1(x.l*q)})});close();toast("Repas ajouté")}};
    draw()},{foot:true})}

  b.innerHTML=`<label class="f" style="margin-top:0">Poids visé (kg)</label>${stepperHTML("gV",nf(v).replace(/\s/g,""),"Objectif en kg")}${S.profile.goalW?`<button class="btn ghost full" id="gDel" style="margin-top:10px">Retirer l'objectif</button>`:""}`;
  bindStepper(b,"gV",.5);const d=b.querySelector("#gDel");if(d)d.onclick=()=>{S.profile.goalW=null;save();close();render()};
  f.innerHTML=`<button class="btn full" id="gOk">Enregistrer</button>`;f.querySelector("#gOk").onclick=()=>{const kg=num(b.querySelector("#gV").value);if(!(kg>25&&kg<350)){toast("Valeur invalide");return}S.profile.goalW=f1(kg);save();close();render()}},{auto:true,foot:true})}
function measForm(){const last=[...S.meas].sort((a,b)=>a.d<b.d?-1:1).pop()||{};
  sheet("Nouvelles mesures",(b,close,f)=>{b.innerHTML=`<label class="f" for="mD" style="margin-top:0">Date</label><input type="date" id="mD" value="${TODAY}" max="${TODAY}">
    <p class="small mute" style="margin:10px 2px 0">En centimètres. Laisse vide ce que tu ne mesures pas.</p>
    <div class="grid2">${MEAS.map(([k,l])=>`<div><label class="f" for="m_${k}">${l}</label><input type="text" inputmode="decimal" id="m_${k}" placeholder="${last[k]!=null?nf(last[k]):"cm"}"></div>`).join("")}</div>`;
  f.innerHTML=`<button class="btn full" id="mOk">Enregistrer</button>`;
  f.querySelector("#mOk").onclick=()=>{const d=b.querySelector("#mD").value||TODAY;const m={d};let n=0;MEAS.forEach(([k])=>{const v=num(b.querySelector("#m_"+k).value);if(v>5&&v<300){m[k]=f1(v);n++}});
    if(!n){toast("Remplis au moins une mesure");return}const ex=S.meas.find(x=>x.d===d);if(ex)Object.assign(ex,m);else S.meas.push(m);save();close();render();toast("Mesures enregistrées")}},{foot:true})}
async function photoAdd(file){let img;try{img=await readImage(file,1100)}catch(e){toast("Impossible de lire cette photo. Essaie une autre image.");return}
  let pose="face";sheet("Nouvelle photo",(b,close,f)=>{
    b.innerHTML=`<img src="${img.url}" alt="Aperçu" style="width:100%;max-height:52vh;object-fit:contain;border-radius:16px;background:var(--soft)">
      <label class="f">Angle</label>${seg("pP",[["face","Face"],["profil","Profil"],["dos","Dos"]],pose)}<label class="f" for="pD">Date</label><input type="date" id="pD" value="${TODAY}" max="${TODAY}">`;
    onSeg(b,"pP",v=>{pose=v;b.querySelectorAll("#pP button").forEach(x=>x.classList.toggle("on",x.dataset.v===v))});
    f.innerHTML=`<button class="btn full" id="pOk">Enregistrer</button>`;
    f.querySelector("#pOk").onclick=async()=>{const d=b.querySelector("#pD").value||TODAY;const ok=await PH.put({id:uid(),d,ts:Date.now(),url:img.url,pose,kg:lastW()});close();UI.trackTab="photos";if(TAB!=="track")TAB="track";render();
      toast(ok?"Photo enregistrée":"Photo affichée, mais le téléphone n'a pas pu la sauvegarder (mémoire ou navigation privée)")}},{auto:true,foot:true})}
function photoView(id){const p=PH.list.find(x=>x.id===id);if(!p)return;sheet(fmtDL(p.d),(b,close)=>{
  b.innerHTML=`<img src="${p.url}" alt="Photo du ${fmtD(p.d)}" style="width:100%;border-radius:16px;display:block"><div class="row" style="margin:10px 2px"><span class="pill">${{face:"Face",profil:"Profil",dos:"Dos"}[p.pose]||"Photo"}</span>${p.kg?`<span class="pill">${nf(p.kg)} kg</span>`:""}</div>
    <button class="btn danger full" id="phDel">${icon("trash",18)} Supprimer la photo</button>`;
  b.querySelector("#phDel").onclick=()=>confirmBox("Supprimer cette photo ?","Elle sera effacée du téléphone.","Supprimer",()=>{PH.del(id);close();render()})})}
function photoCompare(){const L=[...PH.list].sort((a,b)=>a.d<b.d?-1:1);let a=L[0].id,z=L[L.length-1].id;
  sheet("Avant / après",(b)=>{const draw=()=>{const A=L.find(x=>x.id===a),Z=L.find(x=>x.id===z);const opts=v=>L.map(p=>`<option value="${p.id}" ${p.id===v?"selected":""}>${fmtD(p.d)} · ${{face:"face",profil:"profil",dos:"dos"}[p.pose]||""}</option>`).join("");
    b.innerHTML=`<div class="grid2"><select id="cA" aria-label="Photo avant">${opts(a)}</select><select id="cZ" aria-label="Photo après">${opts(z)}</select></div>
      <div class="cmp" style="margin-top:10px"><img src="${A.url}" alt="Avant"><img src="${Z.url}" alt="Après"></div>
      <div class="kpis" style="margin-top:12px"><div><small>Écart</small><b>${daysBetween(A.d,Z.d)} jours</b></div>${A.kg&&Z.kg?`<div><small>Poids</small><b>${Z.kg-A.kg>0?"+":""}${nf(Z.kg-A.kg)} kg</b></div>`:""}</div>`;
    b.querySelector("#cA").onchange=e=>{a=e.target.value;draw()};b.querySelector("#cZ").onchange=e=>{z=e.target.value;draw()}};draw()})}

/* ================== RÉGLAGES ================== */
function settings(focus){sheet("Réglages",(b,close)=>{const P=S.profile,t=targets();
  b.innerHTML=`<div class="sec" style="margin-top:6px" id="s_profil"><h2>Profil</h2></div><div class="card">
      <label class="f" for="sN" style="margin-top:0">Prénom</label><input type="text" id="sN" value="${esc(P.name)}" maxlength="30">
      <label class="f">Sexe</label>${seg("sSex",[["h","Homme"],["f","Femme"]],P.sex)}
      <div class="grid2"><div><label class="f" for="sA">Âge</label><input type="number" id="sA" value="${P.age}" inputmode="numeric"></div><div><label class="f" for="sH">Taille (cm)</label><input type="number" id="sH" value="${P.height}" inputmode="numeric"></div></div>
      <label class="f" for="sAct">Activité (hors muscu comprise)</label><select id="sAct">${[[1.3,"Peu actif (bureau)"],[1.45,"Légèrement actif"],[1.55,"Actif (3-4 séances)"],[1.7,"Très actif (5-6 séances)"],[1.9,"Extrêmement actif"]].map(([v,l])=>`<option value="${v}" ${P.activity==v?"selected":""}>${l}</option>`).join("")}</select>
      <label class="f">Objectif</label><button class="btn sec2 full" id="sGoal">${icon(goalDef().ico,18)} ${goalDef().n} · ${rateLbl(P.rate||0)} ›</button></div>
    <div class="sec"><h2>Objectifs nutrition</h2></div><div class="card">
      <p class="small mute" style="margin:0">Calcul automatique : <b>${t.kcal} kcal</b> et <b>${t.prot} g</b> de protéines par jour (dépense estimée ${t.tdee} kcal). Remplis les cases seulement pour imposer tes chiffres.</p>
      <div class="grid2"><div><label class="f" for="sK">Calories</label><input type="number" id="sK" value="${P.kcal||""}" placeholder="Auto" inputmode="numeric"></div><div><label class="f" for="sPr">Protéines (g)</label><input type="number" id="sPr" value="${P.prot||""}" placeholder="Auto" inputmode="numeric"></div></div></div>
    <div class="sec"><h2>Séance</h2></div><div class="card"><label class="f" style="margin-top:0">Repos par défaut</label>${seg("sR",[["60","1 min"],["90","1 min 30"],["120","2 min"],["180","3 min"]],String(S.set.rest))}
      <div class="tog">Son à la fin du repos<input type="checkbox" id="sSnd" ${S.set.sound?"checked":""}></div><div class="tog" style="border:0">Vibration<input type="checkbox" id="sVib" ${S.set.vib?"checked":""}></div></div>
    <div class="sec"><h2>Apparence</h2></div><div class="card"><label class="f" style="margin-top:0">Thème</label>${seg("sT",[["auto","Auto"],["light","Clair"],["dark","Sombre"]],S.set.theme)}
      <label class="f">Couleur</label><div class="sw">${Object.entries(ACCENTS).map(([k,c])=>`<button data-acc="${k}" class="${S.set.acc===k?"on":""}" style="background:${c}" aria-label="${k}"></button>`).join("")}</div></div>
    <div class="sec" id="s_ia"><h2>Analyse photo des plats</h2></div><div class="card">${AI.sample?`<p class="small" style="margin:0">Activée : l'analyse passe par ton compte Claude.</p>`:`
      <p class="small mute" style="margin:0 0 4px">Pour estimer les calories d'un plat en photo dans l'appli installée, colle ici ta clé API Anthropic (console.anthropic.com › API Keys). Elle reste sur ce téléphone et n'est pas incluse dans les sauvegardes.</p>
      <label class="f" for="sKey">Clé API</label><input type="password" id="sKey" value="${esc(AI.key())}" placeholder="sk-ant-…" autocomplete="off">`}</div>
    <div class="sec"><h2>Données</h2></div><div class="card"><div class="grid2"><button class="btn sec2" id="sExp">${icon("dl",18)} Sauvegarder</button><label class="btn sec2" for="sImp" role="button" tabindex="0">${icon("ul",18)} Restaurer</label></div><input type="file" id="sImp" accept="application/json,.json" class="vh">
      <p class="small mute" style="margin:10px 2px 0">Tout est enregistré sur ce téléphone. Fais une sauvegarde de temps en temps (les photos ne sont pas incluses).</p>
      <button class="btn danger full" id="sWipe" style="margin-top:12px">Tout effacer</button></div>
    <p class="small mute" style="text-align:center;margin:18px 0 0">Forge · version 2</p>`;
  const sv=()=>{save();render()};
  b.querySelector("#sN").oninput=e=>{P.name=e.target.value.trim();sv()};
  onSeg(b,"sSex",v=>{P.sex=v;sv();re()});b.querySelector("#sGoal").onclick=()=>{close();goalSheet()};
  [["#sA","age"],["#sH","height"]].forEach(([s,k])=>b.querySelector(s).onchange=e=>{const v=parseInt(e.target.value);if(v>0){P[k]=v;sv();re()}});
  b.querySelector("#sAct").onchange=e=>{P.activity=+e.target.value;sv();re()};
  b.querySelector("#sK").onchange=e=>{const v=parseInt(e.target.value);P.kcal=v>800?v:null;sv();re()};
  b.querySelector("#sPr").onchange=e=>{const v=parseInt(e.target.value);P.prot=v>20?v:null;sv();re()};
  onSeg(b,"sR",v=>{S.set.rest=+v;sv();re()});
  b.querySelector("#sSnd").onchange=e=>{S.set.sound=e.target.checked;sv()};b.querySelector("#sVib").onchange=e=>{S.set.vib=e.target.checked;sv()};
  onSeg(b,"sT",v=>{S.set.theme=v;sv();re()});b.querySelectorAll("[data-acc]").forEach(x=>x.onclick=()=>{S.set.acc=x.dataset.acc;sv();re()});
  const k=b.querySelector("#sKey");if(k)k.onchange=()=>{try{const v=k.value.trim();v?localStorage.setItem(KEYK,v):localStorage.removeItem(KEYK)}catch(e){}toast(k.value.trim()?"Clé enregistrée":"Clé retirée")};
  b.querySelector("#sExp").onclick=exportData;
  const imp=b.querySelector("#sImp");imp.onchange=()=>{const fl=imp.files&&imp.files[0];imp.value="";if(!fl)return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!o.profile)throw 0;
      confirmBox("Restaurer cette sauvegarde ?","Les données actuelles seront remplacées.","Restaurer",()=>{S=o.v===2?o:migrate(o);localStorage.setItem("forge2",JSON.stringify(S));location.reload()})}catch(e){toast("Fichier de sauvegarde invalide")}};fr.readAsText(fl)};
  b.querySelector("label[for=sImp]").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();imp.click()}};
  b.querySelector("#sWipe").onclick=()=>confirmBox("Tout effacer ?","Programmes, séances, repas, pesées et photos seront supprimés définitivement.","Tout effacer",()=>{PH.clear();S=blank();save();close();TAB="home";render();toast("Données effacées")});
  function re(){const y=b.scrollTop;close();settings();const nb=[...document.querySelectorAll(".sh-b")].pop();if(nb)nb.scrollTop=y}
  if(focus){const el=b.querySelector("#s_"+focus);if(el)setTimeout(()=>el.scrollIntoView({block:"start"}),60)}})}
function exportData(){const data=JSON.stringify(S);const name=`forge-sauvegarde-${TODAY}.json`;
  try{const file=new File([data],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Sauvegarde Forge"}).catch(()=>{});return}}catch(e){}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Sauvegarde téléchargée")}
  catch(e){toast("Téléchargement impossible ici")}}

/* ================== DÉMARRAGE ================== */
$("gear").innerHTML=icon("gear");$("gear").onclick=()=>settings();
if(!GOALDEF[S.profile.goal])S.profile.goal="masse";if(!S.profile._r){const G=GOALDEF[S.profile.goal];if(!G.rates.some(r=>r[0]===S.profile.rate))S.profile.rate=G.def;S.profile._r=1}
S.acts.forEach(a=>{if(!a.kcal)a.kcal=actKcal(a.sp,a.min,a.i)});
save();render();
PH.load().then(()=>{if(TAB==="track")render()});
AI.init();
if(S.live)renderLive();
setInterval(()=>{if(S.live&&!LIVE.open)renderLive()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;const n=new Date();n.setHours(12,0,0,0);const k=key(n);if(k!==TODAY){NOW=n;TODAY=k;UI.nutriDay=null;render()}});

})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
